name: Pull Request Check

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - labeled
      - reopened

jobs:
  check-user-trust:
    runs-on: ubuntu-latest
    outputs:
      is-trusted: ${{ steps.check.outputs.is_trusted }}
    steps:
      - name: Check if PR sender is trusted
        id: check
        run: |
          ASSOC="${{ github.event.sender.author_association }}"
          echo "Sender association: $ASSOC"
          if [[ "$ASSOC" == "OWNER" || "$ASSOC" == "MEMBER" || "$ASSOC" == "COLLABORATOR" ]]; then
            echo "trusted=true" >> $GITHUB_OUTPUT
          else
            echo "trusted=false" >> $GITHUB_OUTPUT
          fi

  compliant-check:
    needs: check-user-trust
    if: needs.check-user-trust.outputs.is_trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check License Header
        uses: apache/skywalking-eyes/header@v0.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Spell
        uses: crate-ci/typos@master

  golangci-lint:
    needs: check-user-trust
    if: needs.check-user-trust.outputs.is_trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          # For self-hosted, the cache path is shared across projects
          # And it works well without the cache of GitHub actions
          # Enable it if we're going to use GitHub only
          cache: true

      - name: GolangCI Lint
        # https://golangci-lint.run/
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          only-new-issues: true
